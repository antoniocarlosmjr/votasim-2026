<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151515">
<title>VotaSim 2026</title>
<style>
:root{--bg:#ecebe7;--panel:#f6f5ef;--ink:#161616;--muted:#666;--green:#56a15c;--orange:#e6a235;--key:#171717}
*{box-sizing:border-box}body{margin:0;background:#d8d8d4;font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
button,select{font:inherit}.app{max-width:1100px;min-height:100vh;margin:auto;background:#efefec}
.top{background:#1c1c1c;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;font-weight:800}
.badge{font-size:11px;font-weight:700;background:#fff2;color:#eee;padding:6px 9px;border-radius:99px}
.page{padding:22px;min-height:calc(100vh - 52px);display:flex;align-items:center;justify-content:center}
.card{width:min(620px,100%);background:#fff;padding:28px;border-radius:16px;box-shadow:0 8px 28px #0001}
h1{font-size:34px;margin:0 0 10px}.lead{font-size:18px;line-height:1.5;color:#444}.notice{font-size:12px;line-height:1.45;color:#6a6a6a;margin-top:18px}
.primary{width:100%;border:0;border-radius:9px;background:#1e1e1e;color:#fff;font-weight:800;padding:16px;cursor:pointer;margin-top:22px}
select{width:100%;padding:14px;border:1px solid #aaa;border-radius:8px;background:#fff}
.urna-wrap{width:100%}.progress{display:flex;justify-content:space-between;gap:12px;color:#666;font-size:12px;margin:0 4px 10px}
.urna{background:#c9c7be;border:1px solid #aaa79d;border-radius:12px;padding:18px;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,.85fr);gap:18px;box-shadow:0 12px 35px #0002}
.display{background:#f4f4ec;border:3px solid #4b4b48;min-height:420px;padding:24px;position:relative;overflow:hidden}
.prompt{font-size:17px;margin-bottom:12px}.office{font-size:28px;font-weight:800;margin:4px 0 22px}.digits{display:flex;gap:6px;min-height:47px;margin-bottom:18px}
.box{width:38px;height:46px;border:2px solid #222;background:#fff;display:flex;align-items:center;justify-content:center;font-size:29px;font-weight:700}
.box.empty{border-color:#777}.candidate-grid{display:grid;grid-template-columns:1fr 130px;gap:14px;align-items:start}
.info{font-size:17px;line-height:1.55}.name{font-size:23px;font-weight:800;margin:4px 0}.photo{height:150px;background:#ddd;border:1px solid #777;display:flex;align-items:center;justify-content:center;text-align:center;color:#666;font-size:12px}
.status{font-size:27px;font-weight:900;margin:18px 0 8px}.legend{font-size:19px;font-weight:800;margin-top:10px}.hint{position:absolute;left:24px;right:24px;bottom:18px;border-top:1px solid #777;padding-top:10px;font-size:13px;line-height:1.45}
.keyboard{background:#2b2b2b;padding:16px 14px 18px;border-radius:8px;align-self:center}.brand{text-align:center;color:#eee;font-size:12px;font-weight:700;letter-spacing:.7px;margin:2px 0 13px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.key{border:0;border-radius:4px;background:var(--key);color:#fff;font-size:25px;font-weight:700;min-height:56px;box-shadow:inset 0 -3px #000;cursor:pointer}.zero{grid-column:2}
.actions{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:7px;margin-top:12px;align-items:end}.action{border:0;border-radius:4px;color:#111;font-size:12px;font-weight:900;height:50px;cursor:pointer}.white{background:#f2f2f2}.correct{background:var(--orange)}.confirm{background:var(--green);height:58px}
.action:disabled,.key:disabled{opacity:.45;cursor:not-allowed}.foot{text-align:center;color:#666;font-size:11px;margin-top:11px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#111;color:#fff;padding:11px 15px;border-radius:8px;font-size:13px;display:none;z-index:10}.toast.show{display:block}
.finish{font-size:74px;font-weight:900;letter-spacing:8px;text-align:center;margin-top:100px}.finish-sub{text-align:center;margin-top:18px;font-size:14px;line-height:1.5}
.summary{margin-top:18px;background:#f5f5f2;padding:14px;border-radius:9px;font-size:13px;line-height:1.6}
@media(max-width:760px){.page{padding:10px;align-items:flex-start}.urna{grid-template-columns:1fr;padding:10px;gap:10px}.display{min-height:330px;padding:16px}.office{font-size:21px;margin-bottom:14px}.box{width:31px;height:39px;font-size:24px}.keyboard{width:100%;max-width:430px;margin:auto}.key{min-height:49px}.candidate-grid{grid-template-columns:1fr 92px}.photo{height:110px}.hint{left:16px;right:16px;bottom:12px}.finish{margin-top:60px;font-size:56px}.top{padding:12px 14px}}
</style>
</head>
<body>
<div class="app"><div class="top"><span>VotaSim 2026</span><span class="badge">SIMULAÇÃO INDEPENDENTE</span></div><main id="app" class="page"></main></div>
<div id="toast" class="toast"></div>
<script>
const offices=[
 {id:"depFederal",name:"DEPUTADO FEDERAL",digits:4,proportional:true},
 {id:"depEstadual",name:"DEPUTADO ESTADUAL",digits:5,proportional:true},
 {id:"senador1",name:"SENADOR — 1ª VAGA",digits:3},
 {id:"senador2",name:"SENADOR — 2ª VAGA",digits:3},
 {id:"governador",name:"GOVERNADOR",digits:2},
 {id:"presidente",name:"PRESIDENTE",digits:2}
];

// Dados fictícios apenas para testar a V2. A próxima etapa substituirá esta coleção
// por dados públicos oficiais, mantendo o simulador independente.
const mockCandidates=[
 {office:"depFederal",state:"SE",number:"1234",name:"CANDIDATA EXEMPLO",party:"PFX",partyNumber:"12"},
 {office:"depEstadual",state:"SE",number:"12345",name:"CANDIDATO EXEMPLO",party:"PFX",partyNumber:"12"},
 {office:"senador1",state:"SE",number:"123",name:"CANDIDATA AO SENADO",party:"PFX",vice:"1º e 2º suplentes fictícios"},
 {office:"senador2",state:"SE",number:"456",name:"CANDIDATO AO SENADO",party:"PDY",vice:"1º e 2º suplentes fictícios"},
 {office:"governador",state:"SE",number:"12",name:"CANDIDATA A GOVERNADORA",party:"PFX",vice:"Vice fictício"},
 {office:"presidente",state:"SE",number:"12",name:"CANDIDATO A PRESIDENTE",party:"PFX",vice:"Vice fictício"}
];
const mockParties=[{number:"12",name:"PARTIDO FICTÍCIO X",sigla:"PFX"},{number:"45",name:"PARTIDO DEMONSTRAÇÃO Y",sigla:"PDY"}];

let state="SE",step=0,input="",blank=false,confirmUnlocked=false,votes=[],unlockTimer=null;
const $=s=>document.querySelector(s);
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800)}
function home(){
 $("#app").innerHTML=`<section class="card"><h1>🗳️ VotaSim 2026</h1><p class="lead">Treine a sequência de votação das Eleições 2026 em uma experiência inspirada no uso da urna eletrônica.</p><button class="primary" onclick="stateScreen()">COMEÇAR SIMULAÇÃO</button><p class="notice"><strong>Importante:</strong> este é um projeto independente e educativo, sem vínculo com o TSE ou com a Justiça Eleitoral. Nenhum voto desta simulação é enviado, registrado ou contabilizado.</p></section>`;
}
function stateScreen(){
 $("#app").innerHTML=`<section class="card"><h2>Onde será a simulação?</h2><p>Escolha a unidade da Federação. Nesta V2 os candidatos ainda são fictícios.</p><select id="state"><option value="SE">Sergipe</option><option value="BA">Bahia</option><option value="SP">São Paulo</option><option value="RJ">Rio de Janeiro</option><option value="DF">Distrito Federal</option></select><button class="primary" onclick="start()">CONTINUAR</button><p class="notice">Na próxima etapa do projeto, esta seleção será usada para carregar os dados correspondentes à UF.</p></section>`;
}
function start(){state=$("#state").value;step=0;input="";blank=false;votes=[];renderVote()}
function office(){return offices[step]}
function candidate(){
 if(blank||input.length!==office().digits)return null;
 return mockCandidates.find(c=>c.office===office().id&&c.state===state&&c.number===input) || null;
}
function party(){
 if(!office().proportional||input.length<2)return null;
 return mockParties.find(p=>p.number===input.slice(0,2)) || null;
}
function voteType(){
 if(blank)return "blank";
 const c=candidate(); if(c)return "candidate";
 const p=party();
 if(office().proportional && input.length>=2 && p && input.length<office().digits)return "legend";
 if(input.length===office().digits && !c){
   if(office().proportional && p)return "legend";
   return "null";
 }
 return "typing";
}
function digitBoxes(){
 if(blank)return "";
 return Array.from({length:office().digits},(_,i)=>`<span class="box ${input[i]?"":"empty"}">${esc(input[i]||"")}</span>`).join("");
}
function detail(){
 const type=voteType(), c=candidate(), p=party();
 if(type==="blank") return `<div class="status">VOTO EM BRANCO</div>`;
 if(type==="candidate") return `<div class="candidate-grid"><div class="info">Número:<div class="name">${esc(c.name)}</div>Partido: <strong>${esc(c.party)}</strong>${c.vice?`<br><span style="font-size:13px">${esc(c.vice)}</span>`:""}</div><div class="photo">FOTO<br>será carregada<br>com os dados reais</div></div>`;
 if(type==="legend") return `<div class="legend">VOTO DE LEGENDA</div><div class="info">Partido: <strong>${esc(p.sigla)}</strong><br>${esc(p.name)}</div>`;
 if(type==="null") return `<div class="status">NÚMERO ERRADO</div><div class="info">VOTO NULO</div>`;
 return `<div class="info">${input.length?"Continue digitando o número.":"Digite o número usando o teclado."}</div>`;
}
function canConfirm(){
 const type=voteType();
 return type==="blank"||type==="candidate"||type==="legend"||type==="null";
}
function renderVote(){
 clearTimeout(unlockTimer); confirmUnlocked=false;
 const can=canConfirm();
 $("#app").innerHTML=`<section class="urna-wrap"><div class="progress"><span>1º TURNO • ${esc(state)}</span><span>VOTAÇÃO ${step+1} DE ${offices.length}</span></div><div class="urna">
 <div class="display"><div class="prompt">Seu voto para</div><div class="office">${esc(office().name)}</div><div class="digits">${digitBoxes()}</div>${detail()}<div class="hint">${can?`Confira seu voto.<br><strong>CORRIGE</strong> para reiniciar este cargo.`:"Use <strong>CORRIGE</strong> para apagar a digitação ou <strong>BRANCO</strong> para votar em branco."}</div></div>
 <div><div class="keyboard"><div class="brand">TECLADO • SIMULAÇÃO</div><div class="keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" onclick="digit('${n}')">${n}</button>`).join("")}<button class="key zero" onclick="digit('0')">0</button></div><div class="actions"><button class="action white" onclick="whiteVote()">BRANCO</button><button class="action correct" onclick="correct()">CORRIGE</button><button id="confirm" class="action confirm" onclick="confirmVote()" ${can?"disabled":""}>CONFIRMA</button></div></div><div class="foot">Nenhum voto é transmitido ou armazenado.</div></div>
 </div></section>`;
 if(can){
   // A urna real reserva um breve período para conferência antes da confirmação.
   unlockTimer=setTimeout(()=>{confirmUnlocked=true; const b=$("#confirm"); if(b)b.disabled=false},1000);
 }
}
function digit(n){
 if(blank||input.length>=office().digits)return;
 input+=n; renderVote();
}
function correct(){input="";blank=false;renderVote()}
function whiteVote(){input="";blank=true;renderVote()}
function confirmVote(){
 if(!canConfirm()||!confirmUnlocked){toast("Confira o voto antes de confirmar.");return}
 const type=voteType(), c=candidate(), p=party();
 if(step===2 && type==="candidate"){
   const first=votes.find(v=>v.office==="senador1");
   if(first && first.number===input){toast("Para as duas vagas do Senado, escolha candidaturas diferentes.");return}
 }
 votes.push({office:office().id,type,number:blank?"":input,label:c?.name||p?.sigla||type});
 if(step===offices.length-1){finish();return}
 step++;input="";blank=false;renderVote();
}
function finish(){
 $("#app").innerHTML=`<section class="card"><div class="finish">FIM</div><div class="finish-sub">Simulação concluída.<br><strong>Nenhum voto foi enviado ou registrado.</strong></div><div class="summary">Você percorreu os seis painéis da votação de 2026. Os nomes usados nesta V2 são fictícios e servem apenas para testar a interface e as regras básicas.</div><button class="primary" onclick="home()">NOVA SIMULAÇÃO</button><p class="notice">VotaSim 2026 é um projeto independente para fins educativos.</p></section>`;
}
home();
</script>
</body>
</html>
